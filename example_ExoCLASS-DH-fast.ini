*~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~*
*  ExoCLASS + DarkHistory, fast (transfer function) interface      *
*~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~*

# Run from the repository root:  ./class example_ExoCLASS-DH-fast.ini
# Requires the out-of-git transfer tables listed in LOWZ_TRANSFER_TABLES.sha256
# (check with: shasum -a 256 -c LOWZ_TRANSFER_TABLES.sha256).
# The slow (full) interface counterpart is example_DarkHistory.ini.

root = output/ExoCLASS-DH-fast
overwrite_root = yes
output = tCl,Sd   # "./class" needs at least one perturbation output; Sd alone stops in perturbations_indices
write_distortions = yes

write background = yes
write parameters = yes

#####################Cosmo Parameters ########################

## NOTE THAT z reio is ignored !
omega_b = 0.02242
omega_cdm = 0.11933
h =0.6766
N_ur = 2.03351
N_ncdm = 1
m_ncdm = 0.06
k_pivot = 0.05
n_s = 0.9665
ln10^{10}A_s = 3.047

##REIONIZATION TREATMENT###
#z_reio = 6.0

reio_parametrization = reio_stars
include_reio_stars_cooling_terms = yes
include_reio_stars_helium = yes
reio_stars_photoion_file = external/heating/photoion_rates_Puchwein.dat
reio_stars_photoheat_file = external/heating/photoheat_rates_Puchwein2.dat
reio_stars_helium_file = external/heating/xHe_DarkHistory.txt

#######################Parameters for energy injection and recombinaison########################
f_eff_type = DarkAges   #we use the DarkAges module to compute the energy deposition in the different channel. By default, it will return a table with (#z_dep	f_heat	f_lya	f_ionH	f_ionHe	f_lowE).
DarkAges_mode = built_in   #default, can choose from user_command "built_in" or "user_command". see doc.
## Transfer tables: 'extend' (recommended) = high-z tables + low-z tables + delayed high->low bridge.
## Diagnostics: 'legacy' (high-z only), 'extend-new', 'low-only', 'low-below-four'.
lowz_transfer_mode = extend

########################DM decay########################
DM_decay_mass = 0.448   #GeV
DM_decay_Gamma = 8.333333333333334e-26
DM_decay_fraction = 1
injected_particle_spectra = dirac_electron
injected_particle_branching_ratio = 1

#######################Spectral distortions########################
## DarkAges returns the non-y residual distortion from the transfer tables...
compute_SD_with_DarkAges = yes
## ...which is ADDED to CLASS's own g/y/mu templates (must be yes for DarkAges;
## if left unset it defaults to no and the residual overwrites the CLASS spectrum).
add_SD_to_CLASS = yes
## y computed exactly from the matter-temperature history set by the heating table.
exact_y = yes
sd_branching_approx = sharp_sharp

## Standard-model residual distortions from DarkHistory
include_DH_SMresidual_distortions = yes

## Redshift and frequency grids (sd_z_min = 1020 by default, be careful!).
## The low-z tables extend down to z ~ 0, so integrate down to there.
sd_z_min = 0.01
sd_z_size = 600
sd_x_min = 1.e-2
sd_x_max = 1.e4
sd_x_size = 500

## Uncomment to output only the exotic contribution. Note that exact_y still
## sees reionization heating, so subtract a no-injection baseline for exotic y.
# sd_only_exotic = yes


write thermodynamics = yes
input_verbose = 1
background_verbose = 1
thermodynamics_verbose = 1
perturbations_verbose = 1
transfer_verbose = 1
primordial_verbose = 1
spectra_verbose = 1
nonlinear_verbose = 1
lensing_verbose = 1
output_verbose = 1
write warnings = yes
distortions_verbose = 10
hyrec_verbose =1
