#######################additional parameters########################
## To compute SD with darkages, set to yes.
compute_SD_with_DarkAges=yes
sd_branching_approx= sharp_sharp

## do we include DM residual distortions ?
include_DH_SMresidual_distortions = yes

##sd_z_min = 1020 by default, be careful!
sd_z_min = 3


###ignore for default treatment###
