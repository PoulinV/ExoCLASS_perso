*~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~*
*  CLASS input parameter file (for energy injection with ExoCLASS) *
*~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~~*

# root = output/test_cooling_noHe
root = output/test_decay
overwrite_root = yes
output = tCl,lCl,pCl,mPk,Sd
write_distortions = yes

write background = yes
write parameters = yes

#####################Cosmo Parameters ########################

## NOTE THAT z reio is ignored !
omega_b = 0.02242
omega_cdm = 0.11933
h =0.6766
N_ur = 2.03351
N_ncdm = 1
m_ncdm = 0.06
k_pivot = 0.05
n_s = 0.9665
ln10^{10}A_s = 3.047


##REIONIZATION TREATMENT###
#z_reio = 6.0
#NEW: CAN NOW REIONIZE WITH STARS (tabulated from Puchwein++).
##
reio_parametrization = reio_stars
#reio_parametrization = reio_none
include_reio_stars_cooling_terms = yes
include_reio_stars_helium = yes
#sd_add_y = 2.0708e-08
reio_stars_photoion_file = /Users/vpoulin/Dropbox/Labo/ProgrammeCMB/ExoCLASS_perso/external/heating/photoion_rates_Puchwein.dat
reio_stars_photoheat_file = /Users/vpoulin/Dropbox/Labo/ProgrammeCMB/ExoCLASS_perso/external/heating/photoheat_rates_Puchwein2.dat
reio_stars_helium_file = /Users/vpoulin/Dropbox/Labo/ProgrammeCMB/ExoCLASS_perso/external/heating/xHe_DarkHistory.txt



# recombination = recfast
#######################Parameters for energy injection and recombinaison########################
f_eff_type = DarkAges   #we use the DarkAges module to compute the energy deposition in the different channel. By default, it will return a table with (#z_dep	f_heat	f_lya	f_ionH	f_ionHe	f_lowE).
DarkAges_mode = built_in   #default, can choose from user_command "built_in" or "user_command". see doc.

########################DM annihilation########################
#injected_particle_spectra = bottom tau photon
#injected_particle_branching_ratio = 0.25 0.25 0.5
# DM_annihilation_mass = 5  #GeV
# DM_annihilation_cross_section = 3e-24 #cm^3s^-1
# DM_annihilation_fraction = 1

########################DM decay########################
DM_decay_mass = 0.448   #GeV
DM_decay_Gamma = 8.333333333333334e-26
DM_decay_fraction = 1
injected_particle_spectra = dirac_electron
injected_particle_branching_ratio = 1



########################PBH evaporation########################
# PBH_evaporation_fraction = 1e-5
# PBH_evaporation_mass = 1e15 #in g

########################PBH accretion########################
